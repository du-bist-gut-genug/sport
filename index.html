    sauver();modal=null;prefill();render();return;
  }
  if(a==="dosubfree"){
    var fi=parseInt(t.getAttribute("data-i"),10);
    var el=document.getElementById("subfree"),nom=el?el.value.trim():"";
    if(!nom)return;
    var orig=vActive().ex[fi];
    var cid="perso-"+nom.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    S.customs[cid]={id:cid,nom:nom,type:orig.type,pas:orig.pas,barre:orig.barre,mus:orig.mus};
    S.active.sub[orig.id]=cid;
    sauver();modal=null;prefill();render();return;
  }
  if(a==="unsub"){
    var ui=parseInt(t.getAttribute("data-i"),10);
    delete S.active.sub[vActive().ex[ui].id];
    sauver();modal=null;prefill();render();return;
  }

  if(a==="editset"){
    var k=parseInt(t.getAttribute("data-k"),10),s=S.active.series[k];
    modal={t:"edit",k:k,charge:s.charge,reps:s.reps};render();return;
  }
  if(a==="ec-"||a==="ec+"||a==="er-"||a==="er+"){
    var eE=getEx(S.active.series[modal.k].exId);
    if(a==="ec-")modal.charge=Math.max(0,Math.round((modal.charge-eE.pas)*100)/100);
    if(a==="ec+")modal.charge=Math.round((modal.charge+eE.pas)*100)/100;
    var pE=eE.type==="temps"?5:1;
    if(a==="er-")modal.reps=Math.max(0,modal.reps-pE);
    if(a==="er+")modal.reps=modal.reps+pE;
    majValeursEdit();return;
  }
  if(a==="editok"){
    var sE=S.active.series[modal.k];
    sE.charge=modal.charge;sE.reps=modal.reps;
    sE.pr=recordVol(sE.exId)>0&&(sE.charge||1)*sE.reps>recordVol(sE.exId);
    sauver();modal=null;prefill();render();return;
  }
  if(a==="editdel"){
    S.active.series.splice(modal.k,1);sauver();modal=null;finAt=null;prefill();render();return;
  }

  if(a==="chstart"){chronoEx=Date.now();majDock();return;}
  if(a==="chstop"){
    if(chronoEx){champ.reps=Math.max(1,Math.round((Date.now()-chronoEx)/1000));chronoEx=null;vibre(20);}
    majDock();return;
  }
  if(a==="plus15"){finAt+=15000;finTotal+=15;sonne=false;planifierNotif();vibre(15);return;}
  if(a==="passer"){finAt=null;sonne=false;annulerNotif();majDock();return;}
  if(a==="finir"){
    var q=buildQueue(vActive());
    if(S.active.series.length>=q.length){modal={t:"fin"};render();return;}
    modal={t:"reste"};render();return;
  }
  if(a==="finreste"){
    /* On retire les blocs non entamés et on rabote les séries non faites des blocs entamés,
       pour que le volume enregistré corresponde exactement à ce qui a été réalisé. */
    var vv2=vActive();
    if(!S.active.retires)S.active.retires=[];
    if(!S.active.moins)S.active.moins={};
    restants().forEach(function(x){
      if(!x.entame){
        if(S.active.retires.indexOf(x.bl.k)<0)S.active.retires.push(x.bl.k);
      }else{
        x.bl.idx.forEach(function(i){
          var f=S.active.series.filter(function(y){return y.slot===i;}).length;
          var n=nbSeries(vv2,i);
          if(n>f)S.active.moins[i]=(S.active.moins[i]||0)+(n-f);
        });
      }
    });
    sauver();modal={t:"fin"};render();return;
  }
  if(a==="rs"){
    ressenti=parseInt(t.getAttribute("data-n"),10);
    var bts=document.querySelectorAll('[data-act="rs"]');
    for(var z=0;z<bts.length;z++)
      bts[z].className=(parseInt(bts[z].getAttribute("data-n"),10)===ressenti)?"on":"";
    vibre(12);return;
  }

  if(a==="save"){
    var nEl=document.getElementById("notes");
    var vv=vActive();
    var idlog=String(Date.now());
    var mn=Math.max(1,Math.round((Date.now()-new Date(S.active.date).getTime())/60000));
    S.logs.push({id:idlog,seanceId:S.active.seanceId,jourNum:S.active.jourNum,
      lieu:S.active.lieu,nom:vv.nom,date:S.active.date,series:S.active.series,
      semaine:S.active.semaine,cycle:S.active.cycle,ressenti:ressenti,duree:mn,
      notes:nEl&&nEl.value?nEl.value:null,sub:S.active.sub});
    S.active=null;majStreakMax();sauver();lockOff();annulerNotif();
    modal={t:"feu",id:idlog};ressenti=null;finAt=null;vue="accueil";render();return;
  }

  if(a==="mesure"){
    var m={date:new Date().toISOString()},vide=true;
    ["poidsCorps","bras","poitrine","taille","cuisse","avantBras"].forEach(function(kk){
      var el2=document.getElementById("m-"+kk);
      var val=el2?parseFloat(String(el2.value).replace(",",".")):NaN;
      m[kk]=isFinite(val)?val:null;if(m[kk]!==null)vide=false;});
    if(vide)return;
    S.mesures.push(m);sauver();render();return;
  }
  if(a==="matos"){
    ["salle","maison"].forEach(function(kk){
      var b=document.getElementById("b-"+kk),d=document.getElementById("d-"+kk);
      var bv=parseFloat(String(b.value).replace(",","."));
      if(isFinite(bv)&&bv>0)S.matos[kk].barre=bv;
      var ds=String(d.value).split(/[,;]/).map(function(x){return parseFloat(x.replace(",","."));})
        .filter(function(x){return isFinite(x)&&x>0;});
      if(ds.length)S.matos[kk].disques=ds.sort(function(a,b){return b-a;});
    });
    sauver();msg="Matériel enregistré.";render();return;
  }
  if(a==="export"){telecharger(JSON.stringify(S,null,2),"json","application/json");
    msg="Sauvegarde téléchargée.";render();return;}
  if(a==="csv"){telecharger(versCSV(),"csv","text/csv;charset=utf-8");
    msg="CSV téléchargé.";render();return;}
  if(a==="pdf"){imprimerBilan();return;}
  if(a==="import"){document.getElementById("fimp").click();return;}
  if(a==="cycle"){S.cycle+=1;S.debutCycle=Date.now();sauver();render();return;}
  if(a==="reset"){
    if(confirm("Effacer toutes tes séances et mesures ? C'est définitif.")&&
       confirm("Vraiment ? Exporte d'abord si tu veux les garder.")){
      S=JSON.parse(JSON.stringify(VIDE));S.matos=JSON.parse(JSON.stringify(MATOS_DEF));
      S.choix=Object.assign({},CHOIX_DEF);sauver();msg="Données effacées.";render();}
    return;
  }
});

function telecharger(contenu,ext,mime){
  var b=new Blob([ext==="csv"?"\ufeff"+contenu:contenu],{type:mime});
  var u=URL.createObjectURL(b),l=document.createElement("a");
  l.href=u;l.download="muscu-"+new Date().toISOString().slice(0,10)+"."+ext;
  document.body.appendChild(l);l.click();document.body.removeChild(l);
  setTimeout(function(){URL.revokeObjectURL(u);},1000);
}
/* Bilan imprimable de la semaine écoulée : on ouvre une fenêtre mise en page
   que le navigateur transforme en PDF via sa propre impression. Aucune
   bibliothèque externe, donc ça marche aussi hors-ligne. */
function bilanSemaine(){
  var ds=debutSemaine();
  var logs=S.logs.filter(function(l){return new Date(l.date).getTime()>=ds;});
  var acc=seriesParMuscle(),st=calcStreak();
  var volTot=0,serTot=0,prs=0,mn=0;
  logs.forEach(function(l){volTot+=volume(l);serTot+=l.series.length;mn+=(l.duree||0);
    l.series.forEach(function(s){if(s.pr)prs++;});});
  var fin=new Date(ds+6*864e5);
  var per=new Date(ds).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+" au "+
          fin.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  var c=S.couleur||"#06B37A";
  var h='<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">'+
    '<title>Semaine du '+new Date(ds).toLocaleDateString("fr-FR")+'</title><style>'+
    '@page{size:A4;margin:14mm}'+
    '*{box-sizing:border-box;margin:0;padding:0}'+
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#101828;'+
    'font-size:11px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    'h1{font-size:23px;font-weight:800;letter-spacing:-.03em}'+
    '.per{color:#667085;font-size:12px;margin-top:3px}'+
    '.kpi{display:flex;gap:8px;margin:14px 0}'+
    '.k{flex:1;background:#F4F6F8;border-radius:10px;padding:11px 9px;text-align:center}'+
    '.k b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em}'+
    '.k span{font-size:9px;color:#667085;font-weight:650;text-transform:uppercase;letter-spacing:.05em}'+
    'h2{font-size:13px;font-weight:750;margin:16px 0 7px;padding-bottom:4px;border-bottom:2px solid '+c+'}'+
    'table{width:100%;border-collapse:collapse;font-size:10px}'+
    'th{text-align:left;background:#12203A;color:#fff;padding:6px 8px;font-size:9px;'+
    'text-transform:uppercase;letter-spacing:.04em}'+
    'td{padding:5px 8px;border-bottom:1px solid #E7EAEE;vertical-align:top}'+
    'tr:nth-child(even) td{background:#FAFBFC}'+
    '.mus{display:flex;align-items:center;gap:7px;margin-bottom:4px}'+
    '.mn{width:74px;font-size:10px;color:#667085;font-weight:650}'+
    '.mt{flex:1;height:7px;background:#EDF1F4;border-radius:4px;position:relative;overflow:hidden}'+
    '.mt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:'+c+'}'+
    '.mt i.hi{background:#F5A524}.mt i.lo{background:#CDD3DB}'+
    '.mt u{position:absolute;top:0;bottom:0;width:1px;background:#fff}'+
    '.mv{width:30px;text-align:right;font-weight:750;font-size:10px}'+
    '.note{background:#F4F6F8;border-left:3px solid '+c+';padding:8px 10px;border-radius:0 8px 8px 0;'+
    'margin-top:6px;font-size:10px}'+
    '.pied{margin-top:18px;padding-top:8px;border-top:1px solid #E7EAEE;color:#98A2B3;font-size:9px;'+
    'display:flex;justify-content:space-between}'+
    '</style></head><body>'+
    '<h1>Bilan de la semaine</h1><div class="per">'+per+'</div>'+
    '<div class="kpi">'+
    '<div class="k"><b>'+logs.length+'</b><span>séances</span></div>'+
    '<div class="k"><b>'+serTot+'</b><span>séries</span></div>'+
    '<div class="k"><b>'+Math.round(volTot).toLocaleString("fr-FR")+'</b><span>kg soulevés</span></div>'+
    '<div class="k"><b>'+mn+'</b><span>minutes</span></div>'+
    '<div class="k"><b>'+prs+'</b><span>records</span></div>'+
    '<div class="k"><b>'+st.n+'</b><span>jours de série</span></div></div>';

  h+='<h2>Séries par muscle</h2>';
  MUSCLES.forEach(function(m){
    var v=acc[m],pc=Math.min(100,v/24*100);
    var cl=v>=10&&v<=20?"":(v>20?"hi":"lo");
    h+='<div class="mus"><span class="mn">'+MNOM[m]+'</span>'+
       '<span class="mt"><i class="'+cl+'" style="width:'+pc.toFixed(1)+'%"></i>'+
       '<u style="left:41.7%"></u><u style="left:83.3%"></u></span>'+
       '<span class="mv">'+fmt(v)+'</span></div>';});
  h+='<div class="note">Zone efficace pour l\'hypertrophie : 10 à 20 séries par muscle et par semaine. '+
     'Les deux repères verticaux marquent ces bornes.</div>';

  if(!logs.length)h+='<h2>Séances</h2><div class="note">Aucune séance enregistrée cette semaine.</div>';
  logs.forEach(function(l){
    var se=SEANCES[l.jourNum];
    h+='<h2>'+JOURS[l.jourNum]+' — '+esc(l.nom||l.seanceId)+' · '+(l.lieu==="salle"?"Salle":"Maison")+
       ' · '+new Date(l.date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+'</h2>'+
       '<table><tr><th>Exercice</th><th>Séries réalisées</th><th style="width:62px">Volume</th></tr>';
    var ids=[],vus={};
    l.series.forEach(function(s){if(!vus[s.exId]){vus[s.exId]=1;ids.push(s.exId);}});
    ids.forEach(function(id){
      var e=getEx(id),ss=l.series.filter(function(x){return x.exId===id;});
      var vv=0;ss.forEach(function(x){vv+=(x.charge||1)*x.reps;});
      h+='<tr><td>'+esc(e.nom)+'</td><td>'+
         ss.map(function(x){return (x.cote?x.cote+" ":"")+(e.type==="poids"?fmt(x.charge)+"×"+x.reps:x.reps)+(x.pr?" ★":"");}).join("  ·  ")+
         '</td><td>'+Math.round(vv).toLocaleString("fr-FR")+' kg</td></tr>';});
    h+='</table>';
    if(l.notes)h+='<div class="note"><b>Note :</b> '+esc(l.notes)+'</div>';
    if(l.ressenti)h+='<div class="note">Ressenti : '+l.ressenti+' / 5'+(l.duree?' · '+l.duree+' min':'')+'</div>';
  });

  var sn=(S.sensations||[]).filter(function(x){return x.date>=ds;});
  if(sn.length){
    h+='<h2>Sensations notées</h2><table><tr><th>Exercice</th><th>Ressenti</th><th>Précision</th></tr>';
    sn.forEach(function(x){
      var r=null;RESSENTIS.forEach(function(y){if(y.k===x.k)r=y;});
      h+='<tr><td>'+esc(getEx(x.exId).nom)+'</td><td>'+(r?r.t:x.k)+'</td><td>'+esc(x.note||"—")+'</td></tr>';});
    h+='</table>';
  }
  h+='<div class="pied"><span>Programme hypertrophie · cycle '+S.cycle+', semaine '+semaineCourante()+'/7</span>'+
     '<span>Édité le '+new Date().toLocaleDateString("fr-FR")+'</span></div></body></html>';
  return h;
}
function imprimerBilan(){
  var w2=window.open("","_blank");
  if(!w2){msg="Le navigateur a bloqué la fenêtre. Autorise les fenêtres pop-up pour cette page.";render();return;}
  w2.document.write(bilanSemaine());
  w2.document.close();
  setTimeout(function(){try{w2.focus();w2.print();}catch(e){}},400);
}
function versCSV(){
  var L=["date;cycle;semaine;seance;lieu;exercice;serie;charge_kg;reps;record;ressenti"];
  S.logs.forEach(function(l){
    var d=new Date(l.date).toISOString().slice(0,10);
    l.series.forEach(function(s){
      L.push([d,l.cycle,l.semaine,(l.nom||l.seanceId),(l.lieu||""),getEx(s.exId).nom,s.set,
              fmt(s.charge),s.reps,(s.pr?"oui":""),(l.ressenti||"")].join(";"));
    });
  });
  S.mesures.forEach(function(m){
    L.push([new Date(m.date).toISOString().slice(0,10),"","","MESURE","","poids de corps","",
            (m.poidsCorps!=null?fmt(m.poidsCorps):""),"","",""].join(";"));
  });
  return L.join("\n");
}

document.getElementById("fimp").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!Array.isArray(j.logs))throw 0;
      S=Object.assign({},VIDE,j);
      if(!S.customs)S.customs={};
      if(!S.matos)S.matos=JSON.parse(JSON.stringify(MATOS_DEF));
      if(!S.choix)S.choix=Object.assign({},CHOIX_DEF);
      sauver();msg="Importé : "+j.logs.length+" séances.";
    }catch(e){msg="Fichier illisible. Vérifie que c'est bien un export de cette app.";}
    render();
  };
  r.readAsText(f);ev.target.value="";
});

/* Le chrono ne redessine plus tout le dock : il met à jour deux nœuds.
   C'est ce qui corrige le clignotement et les appuis perdus sur +15 s / Passer. */
setInterval(function(){
  if(modal&&modal.t==="echauf"&&modal.fin){
    var r=Math.round((modal.fin-Date.now())/1000);
    var m=document.getElementById("echm");
    if(m)m.textContent=mmss(Math.max(0,r));
    if(r<=0){bip();vibre([180,90,180]);modal.i=(modal.i||0)+1;modal.fin=null;render();}
  }
  if(chronoEx){
    var cx=document.getElementById("chx");
    if(cx)cx.textContent=Math.round((Date.now()-chronoEx)/1000);
  }
  if(finAt===null)return;
  var r=Math.round((finAt-Date.now())/1000);
  if(r<=0&&!sonne){sonne=true;bip();vibre([200,100,200]);notifier();}
  if(r<=-4){finAt=null;sonne=false;annulerNotif();if(!modal&&vue==="seance")majDock();return;}
  var v=document.getElementById("tmv"),b=document.getElementById("tmbar");
  if(!v||!b){if(!modal&&vue==="seance")majDock();return;}
  v.textContent=r<=0?"GO":mmss(r);
  if(r<=0)v.classList.add("go3");else v.classList.remove("go3");
  b.style.width=Math.max(0,Math.min(100,(r/finTotal)*100))+"%";
},250);

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}

charger();
majStreakMax();
/* Longue coupure : on propose de repartir plus bas plutôt que d'échouer. */
(function(){
  var j=joursDepuisDerniere();
  if(j!==null&&j>=14&&!S.active&&(!S.reprise||S.reprise.jusqu<Date.now()-30*864e5))modal={t:"reprise"};
})();
if(S.active){vue="seance";if(!S.active.sub)S.active.sub={};if(!S.active.extra)S.active.extra={};
  if(S.active.ordre===undefined)S.active.ordre=null;
  if(!S.active.lieu)S.active.lieu=lieuDe(S.active.jourNum);prefill();lockOn();}
render();
