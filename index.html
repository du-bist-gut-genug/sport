<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone-192.png">
<title>Programme hypertrophie</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}

/* ── thème clair (défaut) ── */
:root{
  --bg:#EDF1F4; --card:#FFFFFF; --card2:#F2F4F7;
  --ink:#101828; --dim:#667085; --dim2:#98A2B3; --line:#E7EAEE;
  --prim:#06B37A; --prim2:#04916B; --prim3:#0BC287; --prim-soft:#E4F7F0;
  --navy:#12203A; --navy2:#1D3055; --onNavy:#FFFFFF;
  --amber:#F5A524; --amber-soft:#FEF3DC; --amber-ink:#96650B;
  --coral:#F0533F; --blue:#2E7CF6;
  --sh:0 2px 4px rgba(16,24,40,.03),0 10px 26px rgba(16,24,40,.07);
  --sh2:0 4px 8px rgba(16,24,40,.04),0 18px 42px rgba(16,24,40,.10);
  --ombre-prim:rgba(6,179,122,.30); --halo1:rgba(6,179,122,.30); --halo2:rgba(46,124,246,.20); --halo3:rgba(245,165,36,.18);
  --r:24px; --ease:cubic-bezier(.22,1,.36,1);
}
/* ── thème sombre ── */
[data-theme="sombre"]{
  --bg:#0E1116; --card:#171B22; --card2:#1F242D;
  --ink:#F2F5F9; --dim:#98A2B3; --dim2:#6C7684; --line:#262C36;
  --prim:#0BC287; --prim2:#5AE3B4; --prim3:#0BC287; --prim-soft:rgba(11,194,135,.14);
  --navy:#0A0D12; --navy2:#151A22; --onNavy:#F2F5F9;
  --amber:#FFC94D; --amber-soft:rgba(255,201,77,.14); --amber-ink:#FFD98A;
  --coral:#FF6A55; --blue:#5AA0FF;
  --sh:0 2px 4px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.4);
  --sh2:0 4px 8px rgba(0,0,0,.35),0 18px 42px rgba(0,0,0,.5);
  --halo1:rgba(11,194,135,.20); --halo2:rgba(46,124,246,.16); --halo3:rgba(245,165,36,.12);
}
html{background:var(--bg);transition:background .35s var(--ease)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color:var(--ink);min-height:100vh;background:transparent;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;padding-bottom:var(--pb,120px);letter-spacing:-.011em;overflow-x:hidden;
  transition:padding-bottom .2s ease;
  transition:color .35s var(--ease);
}
.bg{position:fixed;inset:0;z-index:-2;background:var(--bg);overflow:hidden;transition:background .35s var(--ease)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;will-change:transform}
.b1{width:70vw;height:70vw;max-width:380px;max-height:380px;top:-12%;right:-18%;
  background:radial-gradient(circle,var(--halo1),transparent 70%);animation:fl1 24s var(--ease) infinite alternate}
.b2{width:64vw;height:64vw;max-width:340px;max-height:340px;top:38%;left:-24%;
  background:radial-gradient(circle,var(--halo2),transparent 70%);animation:fl2 29s var(--ease) infinite alternate}
.b3{width:56vw;height:56vw;max-width:300px;max-height:300px;bottom:-6%;right:-16%;
  background:radial-gradient(circle,var(--halo3),transparent 70%);animation:fl1 33s var(--ease) infinite alternate-reverse}
.b4{display:none}
@keyframes fl1{to{transform:translate3d(-14vw,12vh,0) scale(1.2)}}
@keyframes fl2{to{transform:translate3d(16vw,-10vh,0) scale(.85)}}

button{font-family:inherit;border:none;cursor:pointer;color:inherit;font-variant-numeric:tabular-nums;
  transition:transform .16s var(--ease),background .2s ease,box-shadow .2s ease,opacity .2s ease,color .2s ease}
button:active{transform:scale(.97)}
input,select{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}

/* ── en-tête ── */
.hd{position:sticky;top:0;z-index:35;padding:14px 0 12px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h1{font-size:17px;font-weight:750;letter-spacing:-.03em}
.hd span{font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap;
  background:var(--card);padding:6px 11px;border-radius:999px;box-shadow:var(--sh)}
.dl{margin:8px 18px 0;max-width:484px;padding:12px 16px;font-size:12.5px;font-weight:650;
  text-align:center;border-radius:18px;color:var(--amber-ink);background:var(--amber-soft)}
@media(min-width:520px){.dl{margin:8px auto 0}}

/* ── animations d'entrée ── */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes grow{from{width:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
#app.in>.wrap>*{animation:rise .42s var(--ease) both}
#app.in .ex,#app.in .wr,#app.in .card{animation:rise .42s var(--ease) both}

/* ── série (streak) ── */
.streak{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px 18px;
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer}
.streak{width:100%;text-align:left;border:none}
.flamme{width:54px;height:54px;flex:none;border-radius:18px;display:flex;align-items:center;
  justify-content:center;background:var(--amber-soft);position:relative}
.flamme::before{content:"";position:absolute;inset:-4px;border-radius:22px;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,rgba(255,176,32,.45),transparent 68%);
  animation:halo 2.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.13)}}
.fl{width:30px;height:38px;overflow:visible;position:relative}
.fl-o{transform-origin:24px 58px;animation:flick 1.7s ease-in-out infinite}
.fl-i{transform-origin:24px 58px;animation:flick2 .95s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}
  28%{transform:scale(.94,1.07) rotate(-2.5deg)}
  55%{transform:scale(1.05,.95) rotate(2deg)}
  78%{transform:scale(.97,1.03) rotate(-1deg)}}
@keyframes flick2{0%,100%{transform:scale(1,1) translateY(0)}
  45%{transform:scale(.88,1.12) translateY(-1.5px)}
  70%{transform:scale(1.08,.93) translateY(1px)}}
.sp{opacity:0;animation:spark 2.6s ease-out infinite}
.s2{animation-delay:.85s}.s3{animation-delay:1.7s}
@keyframes spark{0%{opacity:0;transform:translateY(8px) scale(.4)}
  18%{opacity:1}100%{opacity:0;transform:translateY(-20px) scale(.15)}}
/* séance du jour pas encore faite : flamme en veille */
.streak.todo .flamme{background:var(--card2)}
.streak.todo .flamme::before{animation:none;opacity:0}
.streak.todo .fl{filter:grayscale(.85);opacity:.5}
.streak.todo .fl-o,.streak.todo .fl-i,.streak.todo .sp{animation:none}
.streak.repos .flamme{background:var(--prim-soft)}
.streak.repos .flamme::before{background:radial-gradient(circle at 50% 62%,rgba(11,194,135,.35),transparent 68%)}
/* grande flamme des félicitations */
.flamme.grand{width:96px;height:96px;margin:0 auto;border-radius:30px;
  animation:entree .6s var(--ease) both}
.flamme.grand .fl{width:54px;height:68px}
.flamme.grand::after{content:"";position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,176,32,.5),transparent 68%);
  opacity:0;animation:onde 2s var(--ease) .3s infinite}
@keyframes entree{0%{transform:scale(.3) rotate(-14deg);opacity:0}
  60%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes onde{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
.boum{animation:pop .5s var(--ease) .2s both}
.note{margin-top:12px;padding:13px 15px;border-radius:16px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:12.5px;font-weight:600;line-height:1.45}
.sk-txt{flex:1;min-width:0}
.sk-n{font-size:17px;font-weight:700;letter-spacing:-.03em}
.sk-n b{font-size:22px}
.sk-e{font-size:12.5px;color:var(--dim);margin-top:3px;font-weight:550}
.sk-max{font-size:10px;color:var(--dim2);font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;text-align:center;flex:none}
.sk-max b{display:block;font-size:17px;color:var(--ink);letter-spacing:-.02em;margin-top:2px}

/* ── carte du jour ── */
.hero{margin-top:16px;border-radius:var(--r);overflow:hidden;position:relative;
  background:linear-gradient(145deg,var(--prim3) 0%,var(--prim) 42%,var(--prim2) 100%);
  box-shadow:0 10px 30px var(--ombre-prim)}
[data-theme="sombre"] .hero{background:linear-gradient(145deg,#0E9E71 0%,#08825E 55%,#066B4D 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 88% -14%,rgba(255,255,255,.26),transparent 62%)}
.hero.rest{background:linear-gradient(145deg,var(--navy2),var(--navy));
  box-shadow:0 10px 30px rgba(18,32,58,.24)}
.hero-in{padding:20px 20px 18px;position:relative;z-index:1}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero-top h2{flex:1 1 auto;min-width:0}
.hero h2{font-size:26px;font-weight:800;line-height:1.08;letter-spacing:-.04em;color:#fff}
.meta{margin-top:7px;font-size:12.5px;color:rgba(255,255,255,.84);font-weight:600}
.tip{margin-top:14px;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.92);
  background:rgba(255,255,255,.15);padding:11px 13px;border-radius:16px}
.pbar{margin-top:14px;height:6px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:#fff;transition:width .5s var(--ease)}
.go{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:16px;border-radius:18px;
  font-size:15.5px;font-weight:700;color:var(--prim2);background:#fff;position:relative;z-index:1;
  box-shadow:0 6px 16px rgba(0,0,0,.16)}
/* dans la carte, le bouton suit le padding du bloc et non les marges du bas */
.go.haut{width:100%;margin:16px 0 0}
[data-theme="sombre"] .go{color:#04916B}
.go.alt{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.quit{background:rgba(255,255,255,.18);color:#fff;font-size:12.5px;font-weight:650;
  padding:8px 12px;border-radius:999px;flex:none}
.back{background:var(--card);color:var(--ink);font-size:13px;font-weight:650;padding:10px 15px;
  border-radius:999px;box-shadow:var(--sh);margin-top:16px}

/* ── bascule salle / maison ── */
.tg{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.2);border-radius:999px;flex:none}
.tg button{padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:none;min-height:36px}
.tg button.on{background:#fff;color:var(--prim2)}
.tg.large{width:100%;background:var(--card2);padding:5px;box-shadow:var(--sh)}
.tg.large button{flex:1;padding:13px;font-size:14px;color:var(--dim)}
.tg.large button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tg.mini{background:var(--card2);padding:3px}
.tg.mini button{padding:10px 14px;font-size:12px;color:var(--dim);min-height:38px}
.tg.mini button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

.sec{margin:26px 0 10px;font-size:11px;font-weight:750;color:var(--dim2);
  text-transform:uppercase;letter-spacing:.09em}
.week{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wr{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:13.5px;width:100%;
  border-bottom:1px solid var(--line);background:none;text-align:left}
.wr:last-child{border-bottom:none}
.wr:active{background:var(--card2);transform:none}
.wr.auj{background:var(--prim-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--prim);box-shadow:0 0 0 4px var(--prim-soft)}
.dot.off{background:transparent;border:1.5px solid var(--dim2)}
.wr b{font-weight:650;min-width:72px;flex:none}
.wr i{font-style:normal;color:var(--dim);font-size:12.5px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tagl{font-size:10px;font-weight:750;padding:4px 8px;border-radius:999px;flex:none;
  text-transform:uppercase;letter-spacing:.04em}
.tagl.salle{background:var(--prim-soft);color:var(--prim2)}
.tagl.maison{background:var(--card2);color:var(--dim)}
.chev{color:var(--dim2);font-size:18px;flex:none;line-height:1}

/* ── exercices ── */
.ex{margin-bottom:11px;background:var(--card);border-radius:22px;box-shadow:var(--sh);
  overflow:hidden;position:relative;transition:box-shadow .3s var(--ease),opacity .3s ease}
.ex.grp::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;
  border-radius:0 4px 4px 0;background:var(--blue)}
.ex.now{box-shadow:0 0 0 2px var(--prim),0 10px 28px var(--ombre-prim)}
.ex.fini{opacity:.45}
.exh{padding:16px 18px 0}
.exn{font-size:15.5px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.exs{font-size:12px;color:var(--dim);margin-top:5px;font-weight:550}
.exo{display:inline-block;font-size:12px;font-weight:700;color:var(--prim2);margin-top:9px;
  background:var(--prim-soft);padding:5px 10px;border-radius:999px;animation:pop .35s var(--ease) both}
.sets{display:flex;gap:7px;padding:13px 18px 16px;flex-wrap:wrap}
.st{font-size:12px;font-weight:650;padding:7px 10px;border-radius:12px;min-width:48px;
  text-align:center;background:var(--card2);color:var(--dim);transition:all .25s var(--ease)}
.st.done{background:var(--navy);color:var(--onNavy);animation:pop .3s var(--ease) both}
[data-theme="sombre"] .st.done{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.st.cur{background:var(--prim);color:#fff;box-shadow:0 5px 14px var(--ombre-prim)}
.st.pr{background:var(--amber);color:#12203A;box-shadow:0 5px 14px rgba(245,165,36,.4)}
.st em{font-style:normal;display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;margin-top:2px}
button.st{cursor:pointer;font-family:inherit}
.acts{display:flex;gap:9px;padding:0 18px 16px}
.abtn{flex:1;padding:11px;border-radius:14px;font-size:12.5px;font-weight:650;color:var(--dim);background:var(--card2)}
.abtn:active{color:var(--ink)}
.swap{display:block;font-size:10.5px;font-weight:700;color:var(--blue);margin-top:4px;
  text-transform:uppercase;letter-spacing:.05em}

/* ── pavé de saisie ── */
.pad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-radius:28px 28px 0 0;box-shadow:0 -6px 40px rgba(16,24,40,.16);
  padding-bottom:env(safe-area-inset-bottom);animation:rise .3s var(--ease) both}
[data-theme="sombre"] .pad{box-shadow:0 -6px 40px rgba(0,0,0,.55)}
.pad .wrap{padding:16px 18px 20px}
.padt{font-size:12.5px;color:var(--dim);font-weight:650;margin-bottom:12px;
  display:flex;justify-content:space-between;gap:10px}
.padt span:last-child{color:var(--prim2);text-align:right;font-weight:700}
.rows{display:flex;gap:11px}
.fld{flex:1;border-radius:20px;padding:11px 10px 13px;text-align:center;background:var(--card2)}
.fld small{display:block;font-size:10px;color:var(--dim2);font-weight:700;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.07em}
.fldr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stp{width:44px;height:44px;border-radius:15px;font-size:23px;font-weight:500;line-height:1;
  background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(16,24,40,.12)}
.val{font-size:25px;font-weight:800;flex:1;letter-spacing:-.04em}
.okb{width:100%;margin-top:13px;font-size:16px;font-weight:700;padding:17px;border-radius:20px;
  color:#fff;background:linear-gradient(180deg,var(--prim3),var(--prim2));
  box-shadow:0 8px 22px var(--ombre-prim)}
.okb:disabled{background:var(--card2);color:var(--dim2);box-shadow:none;transform:none}
.plates{margin-top:11px;padding:11px 14px;border-radius:16px;font-size:12px;font-weight:650;
  color:var(--amber-ink);background:var(--amber-soft)}

/* ── chrono ── */
.tm{position:fixed;left:0;right:0;bottom:0;z-index:50;overflow:hidden;
  background:linear-gradient(150deg,var(--navy2),var(--navy));color:#fff;
  border-radius:28px 28px 0 0;box-shadow:0 -6px 40px rgba(16,24,40,.3);
  padding-bottom:env(safe-area-inset-bottom);animation:rise .3s var(--ease) both}
.bar{height:4px;background:linear-gradient(90deg,var(--prim3),#5AE3B4);transition:width .25s linear}
.tmin{padding:20px 18px}
.tmr{display:flex;align-items:center;justify-content:space-between;max-width:520px;margin:0 auto;gap:12px}
.big{font-size:50px;font-weight:800;letter-spacing:-.05em;line-height:1;color:#fff}
.big.go3{color:#5AE3B4;animation:pulse 1s var(--ease) infinite}
.tsub{font-size:12px;color:rgba(255,255,255,.66);font-weight:600;margin-top:5px}
.tbs{display:flex;gap:9px}
.tb{font-size:13px;font-weight:700;padding:14px 16px;border-radius:16px;white-space:nowrap;
  background:rgba(255,255,255,.14);color:#fff}
.tb.go2{background:linear-gradient(180deg,var(--prim3),var(--prim2));
  box-shadow:0 6px 18px var(--ombre-prim)}

/* ── navigation ── */
.nav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:18px;right:18px;
  max-width:484px;margin:0 auto;display:flex;z-index:30;border-radius:24px;
  background:var(--card);box-shadow:var(--sh2);padding:7px}
.nav button{flex:1;padding:9px 4px;background:none;font-size:10px;font-weight:650;
  color:var(--dim2);display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:18px}
.nav button.on{color:var(--prim2);background:var(--prim-soft)}
.nav em{font-style:normal;font-size:17px;line-height:1;transition:transform .25s var(--ease)}
.nav button.on em{transform:scale(1.12)}

/* ── divers ── */
.card{margin-bottom:11px;padding:18px;background:var(--card);border-radius:22px;box-shadow:var(--sh)}
.card.tap{cursor:pointer}
.det{margin-top:10px;border-top:1px solid var(--line);padding-top:4px;animation:rise .3s var(--ease) both}
.h2{font-size:20px;font-weight:780;letter-spacing:-.03em;margin:26px 0 12px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.lr:last-child{border-bottom:none}
.mut{color:var(--dim);font-size:12.5px}
.btn{width:100%;margin-top:10px;padding:15px;border-radius:18px;font-size:14px;font-weight:680;
  background:var(--card2);color:var(--ink)}
.btn.prim{background:linear-gradient(180deg,var(--prim3),var(--prim2));color:#fff;
  box-shadow:0 6px 18px var(--ombre-prim)}
.btn.dg{background:var(--coral);color:#fff;box-shadow:0 6px 18px rgba(240,83,63,.28)}
.btn.gh{background:var(--card2);color:var(--ink)}
.sel{width:100%;padding:15px;border-radius:18px;font-size:14px;color:var(--ink);margin-bottom:12px;
  background:var(--card);border:none;box-shadow:var(--sh);appearance:none;font-weight:600}
.in{width:100%;padding:13px;border-radius:15px;font-size:15px;margin-top:5px;color:var(--ink);
  background:var(--card2);border:1.5px solid transparent}
.in::placeholder{color:var(--dim2)}
.in:focus{outline:none;border-color:var(--prim);box-shadow:0 0 0 4px var(--prim-soft)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g2 label{font-size:10.5px;font-weight:700;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em}
.emp{text-align:center;color:var(--dim);font-size:13.5px;padding:30px 16px;line-height:1.6}

/* ── séries par muscle ── */
.mus{padding:18px}
.mrow{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.mnom{font-size:12.5px;font-weight:650;width:84px;flex:none;color:var(--dim)}
.mtrack{flex:1;height:9px;border-radius:6px;background:var(--card2);position:relative;overflow:hidden}
.mtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;animation:grow .7s var(--ease) both}
.mtrack i.lo{background:var(--dim2)}
.mtrack i.ok{background:linear-gradient(90deg,var(--prim3),var(--prim))}
.mtrack i.hi{background:linear-gradient(90deg,var(--amber),#EF8A15)}
.mtrack u{position:absolute;top:0;bottom:0;width:1.5px;background:var(--card)}
.mval{font-size:12.5px;font-weight:750;width:32px;text-align:right;flex:none;color:var(--dim2)}
.mval.ok{color:var(--prim2)}.mval.hi{color:var(--amber-ink)}
.mleg{font-size:11px;line-height:1.55;color:var(--dim2);margin-top:12px;
  border-top:1px solid var(--line);padding-top:11px}

/* ── graphique ── */
.gh{font-size:12.5px;color:var(--dim);font-weight:650;margin-bottom:8px}
.gsvg{width:100%;height:auto;display:block}
.gl{stroke:var(--line)}
.gt{fill:var(--dim2)}
.gd{fill:var(--prim);stroke:var(--card);stroke-width:1.5}
.gline{stroke:var(--prim)}
.gs1{stop-color:var(--prim);stop-opacity:.22}
.gs2{stop-color:var(--prim);stop-opacity:0}

/* ── feuilles ── */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
  background:rgba(8,11,16,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet{width:100%;max-width:520px;margin:0 auto;border-radius:30px 30px 0 0;padding:24px 20px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));animation:up .42s var(--ease) both;
  background:var(--card);max-height:88vh;overflow-y:auto}
.sheet.center{text-align:center}
.sh1{font-size:22px;font-weight:800;letter-spacing:-.035em}
.shl{font-size:13px;font-weight:700;margin-top:18px;margin-bottom:3px}
.rs{display:flex;gap:9px;margin-top:9px}
.rs button{flex:1;padding:16px 0;border-radius:16px;font-size:17px;font-weight:750;
  color:var(--dim);background:var(--card2)}
.rs button.on{background:var(--prim);color:#fff;box-shadow:0 6px 18px var(--ombre-prim)}
.subl{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.subi{padding:12px 15px;border-radius:16px;font-size:13px;font-weight:650;color:var(--ink);background:var(--card2)}
.subi.on{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(46,124,246,.3)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── bouton info ── */
.info{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:50%;background:var(--card2);color:var(--dim);font-size:14px;font-weight:800;
  font-style:italic;margin-left:8px;vertical-align:-6px;line-height:1;flex:none;font-family:Georgia,serif;
  position:relative}
/* zone tactile élargie sans déplacer le visuel */
.info::after{content:"";position:absolute;inset:-9px}
.info:active{background:var(--prim);color:#fff;transform:scale(1.15)}
.ex.now .info{background:var(--prim-soft);color:var(--prim2)}
.htools{display:flex;gap:6px;flex:0 0 auto;flex-wrap:nowrap;margin-left:auto}
.quit{white-space:nowrap;padding:8px 11px}
@media(max-width:360px){.hero-top h2{flex:1 1 100%}.htools{margin-left:0}}

/* ── fiche d'exécution ── */
.mach{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--prim-soft);
  color:var(--prim2);font-size:13.5px;font-weight:700;line-height:1.4}
.mlab{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--prim);opacity:.85;margin-bottom:4px}
.altl{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.alti{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
  background:var(--card2);font-size:13px;font-weight:600;line-height:1.35}
.alti b{width:21px;height:21px;flex:none;border-radius:50%;background:var(--card);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.errb{margin-top:6px;padding:12px 14px;border-radius:16px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:12.5px;font-weight:600;line-height:1.45}

/* ── réorganisation ── */
.ordi{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:16px;
  background:var(--card2);margin-top:8px;animation:slidein .3s var(--ease) both}
.ordi.lock{opacity:.5}
.ordn{flex:1;font-size:13px;font-weight:650;line-height:1.3}
.ordb{width:38px;height:38px;flex:none;border-radius:12px;background:var(--card);color:var(--ink);
  font-size:16px;font-weight:700;box-shadow:var(--sh)}
.ordb:disabled{opacity:.3;box-shadow:none}
.lk{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2)}

/* ── séance raccourcie ── */
.chrono-btn{margin-top:12px;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.2);color:#fff}
.tipm{margin-top:10px;font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);
  padding:7px 11px;border-radius:12px;display:inline-block}
.tps{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.tpsi{padding:15px 16px;border-radius:18px;background:var(--card2);color:var(--ink);text-align:left}
.tpsi b{display:block;font-size:15px;font-weight:750}
.tpsi i{font-style:normal;display:block;font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:600}
.tpsi.on i{color:rgba(255,255,255,.8)}
.tpsi.on{background:var(--prim);color:#fff;box-shadow:0 6px 18px var(--ombre-prim)}

/* ── alertes d'accueil ── */
.alerte{display:flex;align-items:center;gap:13px;width:100%;margin-top:11px;padding:14px 16px;
  border-radius:20px;background:var(--amber-soft);text-align:left}
.alerte.photo{background:var(--card)}
.al-ic{width:38px;height:38px;flex:none;border-radius:13px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--amber-ink)}
.al-tx{flex:1;min-width:0}
.al-tx b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.al-tx i{font-style:normal;display:block;font-size:11.5px;color:var(--dim);margin-top:2px}

/* ── stagnation ── */
.stagb{margin-top:8px;padding:9px 12px;border-radius:13px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:11.5px;font-weight:650;line-height:1.4}
.stagi{margin-top:11px;padding:14px;border-radius:18px;background:var(--card2)}
.stagn{font-size:14px;font-weight:750}
.stagc{font-size:12px;color:var(--dim);margin-top:4px;font-weight:600}
.stagq{font-size:12.5px;line-height:1.45;margin-top:7px}

/* ── bilan de séance ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{padding:15px 10px;border-radius:18px;background:var(--card2)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.035em}
.stat span{display:block;font-size:11px;color:var(--dim);font-weight:650;margin-top:3px}
.stat.or{background:var(--amber-soft)}
.stat.or b{color:var(--amber-ink)}
.cmp{margin-top:12px;padding:12px 14px;border-radius:16px;font-size:12.5px;font-weight:650;line-height:1.4}
.cmp.pos{background:var(--prim-soft);color:var(--prim2)}
.cmp.neg{background:var(--card2);color:var(--dim)}

/* ── échauffement ── */
.echl{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.echi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--card2)}
.echi b{width:24px;height:24px;flex:none;border-radius:50%;background:var(--prim);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.echi span{font-size:13px;font-weight:600;line-height:1.35}

/* ── chrono d'exercice ── */
.chstart{width:100%;margin-top:11px;padding:14px;border-radius:18px;font-size:14px;font-weight:700;
  background:var(--card2);color:var(--ink)}
.fld.chrono{background:var(--prim-soft)}
.fld.chrono .val{color:var(--prim2)}
.stp.stop{background:var(--coral);color:#fff}

/* ── anatomie et mouvement ── */
.visu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vbloc{background:var(--card2);border-radius:18px;padding:12px 10px;text-align:center}
.vlab{display:block;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:8px}
.anat{width:100%;height:auto}
.anat .sil{fill:var(--line)}
.anat .mn{fill:var(--dim2);opacity:.35}
.anat .ms{fill:var(--prim);opacity:.42}
.anat .mp{fill:var(--prim);opacity:1}
.anat .anl{fill:var(--dim2);font-size:7px;text-anchor:middle;font-weight:700}
.leg{display:flex;align-items:center;justify-content:center;gap:5px;font-size:9.5px;
  color:var(--dim2);font-weight:650;margin-top:6px;flex-wrap:wrap}
.leg span{width:8px;height:8px;border-radius:50%;display:inline-block}
.leg .lp{background:var(--prim)}
.leg .ls{background:var(--prim);opacity:.42;margin-left:6px}
.mouv{width:100%;height:auto}
.mouv .sol{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.mouv .tete{fill:var(--ink);opacity:.85}
.mouv .tronc,.mouv .os{stroke:var(--ink);stroke-width:4;stroke-linecap:round;opacity:.85}
.mouv .charge rect{fill:var(--prim)}
.mtxt{font-size:10.5px;line-height:1.35;color:var(--dim);margin-top:6px;font-weight:600}
/* mouvements : chaque famille anime les bons segments */
.m-poussee-h .bras-h{transform-origin:60px 33px;animation:mvA 2.4s ease-in-out infinite}
.m-poussee-h .charge{animation:mvCh 2.4s ease-in-out infinite}
@keyframes mvA{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes mvCh{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
.m-poussee-v .bras-h{transform-origin:60px 33px;animation:mvB 2.4s ease-in-out infinite}
.m-poussee-v .charge{animation:mvBc 2.4s ease-in-out infinite}
@keyframes mvB{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(-120deg)}}
@keyframes mvBc{0%,100%{transform:translateY(-8px)}50%{transform:translateY(-30px)}}
.m-tirage-v .bras-h{transform-origin:60px 33px;animation:mvC 2.6s ease-in-out infinite}
@keyframes mvC{0%,100%{transform:rotate(-115deg)}50%{transform:rotate(-55deg)}}
.m-tirage-v .charge{animation:mvCc 2.6s ease-in-out infinite}
@keyframes mvCc{0%,100%{transform:translateY(-32px)}50%{transform:translateY(-8px)}}
.m-tirage-h .bras-b{transform-origin:78px 42px;animation:mvD 2.4s ease-in-out infinite}
.m-tirage-h .g2 .bras-b{transform-origin:42px 42px}
@keyframes mvD{0%,100%{transform:rotate(0)}50%{transform:rotate(-58deg)}}
.m-elevation .bras-h{transform-origin:60px 33px;animation:mvE 2.6s ease-in-out infinite}
@keyframes mvE{0%,100%{transform:rotate(38deg)}50%{transform:rotate(-30deg)}}
.m-oiseau .corps{transform-origin:60px 58px;transform:rotate(-38deg)}
.m-oiseau .bras-h{transform-origin:60px 33px;animation:mvE 2.6s ease-in-out infinite}
.m-curl .bras-b{transform-origin:78px 42px;animation:mvF 2.2s ease-in-out infinite}
.m-curl .g2 .bras-b{transform-origin:42px 42px}
@keyframes mvF{0%,100%{transform:rotate(0)}50%{transform:rotate(-105deg)}}
.m-extension .bras-b{transform-origin:78px 42px;animation:mvG 2.2s ease-in-out infinite}
.m-extension .g2 .bras-b{transform-origin:42px 42px}
@keyframes mvG{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(5deg)}}
.m-squat .corps{animation:mvH 2.8s ease-in-out infinite}
@keyframes mvH{0%,100%{transform:translateY(0)}50%{transform:translateY(16px)}}
.m-squat .jambe-h{transform-origin:60px 58px;animation:mvHj 2.8s ease-in-out infinite}
@keyframes mvHj{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.m-charniere .corps{transform-origin:60px 58px;animation:mvI 2.8s ease-in-out infinite}
@keyframes mvI{0%,100%{transform:rotate(0)}50%{transform:rotate(-42deg)}}
.m-mollets .corps{animation:mvJ 1.8s ease-in-out infinite}
@keyframes mvJ{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.m-gainage .corps{transform-origin:60px 58px;transform:rotate(-74deg) translateY(-14px)}
.m-grip .charge{animation:mvK 2.2s ease-in-out infinite}
@keyframes mvK{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.m-grip .bras-h,.m-poussee-h .bras-b{transform-origin:60px 33px}

/* ── flamme : taille par palier ── */
.fl{transform:scale(var(--t,1));transform-origin:50% 100%}
.pal{color:var(--amber-ink)}
.palb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--amber-ink);margin-top:8px}

/* ── réorganisation ── */
.ordz{position:relative}
.poig{width:26px;flex:none;text-align:center;font-size:15px;color:var(--dim2);cursor:grab;
  touch-action:none;user-select:none}
.ordi.drag{z-index:5;box-shadow:var(--sh2);background:var(--card);position:relative}
.ordi{touch-action:pan-y}

/* ── célébration plein écran ── */
.feu{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 58%,#2B1403 0%,#120A02 45%,#07070A 100%);
  animation:fade .4s ease both;overflow:hidden;color:#fff}
.parts{position:absolute;inset:0;pointer-events:none}
.parts i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,#FFD86B,#FF8A3D);animation:monte linear infinite;opacity:0}
@keyframes monte{0%{opacity:0;transform:translateY(0) scale(.6)}
  12%{opacity:1}100%{opacity:0;transform:translateY(-105vh) scale(.2)}}
.feu-in{position:relative;text-align:center;padding:20px}
.flamme.geante{width:210px;height:210px;margin:0 auto;border-radius:60px;background:none;
  animation:entree .7s var(--ease) both}
.flamme.geante::before{inset:-20px;border-radius:50%;
  background:radial-gradient(circle at 50% 62%,rgba(255,176,32,.55),transparent 66%)}
.flamme.geante .fl{width:150px;height:190px}
.feu-n{font-size:96px;font-weight:800;letter-spacing:-.06em;line-height:1;margin-top:6px;
  text-shadow:0 0 44px rgba(255,170,40,.6);animation:pop .55s var(--ease) .25s both}
.feu-j{font-size:17px;font-weight:700;opacity:.88;animation:pop .55s var(--ease) .35s both}
.feu-p{margin-top:16px;display:inline-block;padding:9px 18px;border-radius:999px;
  background:rgba(255,176,32,.18);color:#FFD86B;font-size:13px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;animation:pop .55s var(--ease) .45s both}
.feu-s{margin-top:14px;font-size:12.5px;opacity:.6;animation:pop .55s var(--ease) .55s both}
.feu-t{margin-top:34px;font-size:12px;opacity:.45;animation:pulse 2.4s ease-in-out 1s infinite}

/* ── exercices complémentaires ── */
.plusm{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.plusl{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.plusv{font-size:11.5px;font-weight:750}
.plusv.ok{color:var(--prim2)}.plusv.hi{color:var(--amber-ink)}.plusv.lo{color:var(--dim2)}
.plusw{margin-top:6px;font-size:11.5px;color:var(--amber-ink);background:var(--amber-soft);
  padding:9px 11px;border-radius:13px;font-weight:600;line-height:1.4}

/* ── tests ── */
.tst .tstl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tstl b{font-size:14px}
.tstv{font-size:18px;font-weight:800;text-align:right;color:var(--prim2);line-height:1.1}
.tstv i{display:block;font-style:normal;font-size:9.5px;font-weight:700;color:var(--dim2);
  text-transform:uppercase;letter-spacing:.06em}
.tstv.vide{color:var(--dim2);font-size:22px}
.gain{color:var(--prim2)}.perte{color:var(--coral)}
.estim{margin-top:12px;padding:14px;border-radius:16px;background:var(--prim-soft);
  color:var(--prim2);font-size:14px;font-weight:650;text-align:center}
.estim b{font-size:19px;font-weight:800}

/* ── graphiques multiples ── */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:9px 13px;border-radius:999px;font-size:12px;font-weight:650;background:var(--card);
  color:var(--dim);border:1.5px solid var(--line)}
.chip.on{color:#fff;border-color:transparent}
.clg{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.clgi{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--dim)}
.clgi i{width:12px;height:3px;border-radius:2px;display:inline-block}
.cline{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 1.1s var(--ease) both}
@keyframes trace{to{stroke-dashoffset:0}}

/* ── palettes de couleurs ── */
.pals{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.pali{aspect-ratio:1;border-radius:14px;border:3px solid transparent;box-shadow:var(--sh)}
.pali.on{border-color:var(--ink);transform:scale(1.08)}
.cust{display:flex;gap:10px;align-items:center;margin-top:8px}
.cust input[type=color]{width:52px;height:48px;border:none;border-radius:14px;background:none;
  padding:0;cursor:pointer}

/* ── retrait d'exercices ── */
.ordb.sup{background:var(--card2);color:var(--coral);font-size:14px}
.ordb.sup:active{background:var(--coral);color:#fff}
.ordi.off{opacity:.6;background:transparent;border:1.5px dashed var(--line)}
.ordi.off .ordn{text-decoration:line-through;color:var(--dim2)}
.ordb.rem{width:auto;padding:0 13px;font-size:12px;font-weight:700;color:var(--prim2);
  background:var(--prim-soft);box-shadow:none}
.restl{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.resti{padding:13px 15px;border-radius:16px;background:var(--card2)}
.restn{font-size:13.5px;font-weight:700;line-height:1.3}
.restn i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--dim);margin-top:3px}

/* ── salle bondée ── */
.bondl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bondi{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:16px;
  background:var(--card2);text-align:left;width:100%}
.bcase{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff}
.bondi.on{background:var(--amber-soft)}
.bondi.on .bcase{background:var(--amber);border-color:var(--amber)}
.bnom{flex:1;font-size:13px;font-weight:650;line-height:1.3}
.bet{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;
  color:var(--dim2);flex:none}
.bondi.on .bet{color:var(--amber-ink)}

/* ── sensations ── */
.sensl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sensi{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;
  background:var(--card2);text-align:left;width:100%;border:2px solid transparent}
.sensi .se{font-size:20px;flex:none;line-height:1}
.st2{font-size:13.5px;font-weight:650}
.sensi.on{border-color:var(--prim);background:var(--prim-soft)}
.sensi.alerte.on{border-color:var(--amber);background:var(--amber-soft)}
.sensi.danger.on{border-color:var(--coral);background:rgba(240,83,63,.12)}
.histn{display:flex;flex-direction:column;gap:7px;margin-top:8px}

/* Temps de repos minimaux, d'après Schoenfeld et al. (2016) et la méta-analyse
   bayésienne de 2024 : au-delà de 60 s le gain existe, et il est net à 2 min sur
   les mouvements polyarticulaires. On relève donc les valeurs trop courtes. */
function normaliseRepos(){
  Object.keys(SEANCES).forEach(function(j){
    ["salle","maison"].forEach(function(l){
      var v=SEANCES[j].v[l];if(!v)return;
      v.ex.forEach(function(e,i){
        if(e.repos===0)return;                       /* enchaîné dans un superset */
        var poly=(e.mus&&e.mus.length>=2);           /* polyarticulaire */
        var mini=e.grp?75:(poly?120:90);             /* fin de superset : 75 s */
        if(e.repos<mini)e.repos=mini;
      });
    });
  });
}

function famille(ex){
  var n=(ex.nom||"").toLowerCase(), m=(ex.mus&&ex.mus[0])||"";
  if(/traction|tirage vertical|pull-over|tirage prise/.test(n))return "tirage-v";
  if(/rowing|tirage horizontal/.test(n))return "tirage-h";
  if(/militaire|épaules|arnold|barre guidée/.test(n))return "poussee-v";
  if(/élévation/.test(n))return "elevation";
  if(/oiseau|face pull|rear delt|postérieur/.test(n))return "oiseau";
  if(/curl/.test(n))return "curl";
  if(/triceps|barre au front|dips|pushdown|nuque|corde/.test(n))return "extension";
  if(/mollets/.test(n))return "mollets";
  if(/squat|presse|hack|fente|bulgare|leg extension/.test(n))return "squat";
  if(/soulevé|roumain|hip thrust|good morning|leg curl|pont/.test(n))return "charniere";
  if(/planche|hollow|crunch|relevés|gainage|abdo/.test(n))return "gainage";
  if(/poignet|suspension|farmer/.test(n))return "grip";
  if(m==="pecs")return "poussee-h";
  if(m==="dos")return "tirage-h";
  if(m==="quadri"||m==="fessiers")return "squat";
  if(m==="ischios")return "charniere";
  return "poussee-h";
}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){n=Math.round(n*100)/100;return Number.isInteger(n)?String(n):String(n).replace(".",",");}
function jours(n){return n+" jour"+(n>1?"s":"");}
function mmss(s){s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function volume(l){var v=0;l.series.forEach(function(s){v+=(s.charge||1)*s.reps;});return v;}
function estRepos(j){return !SEANCES[j];}
function lieuDe(j){return (S.choix&&S.choix[j])||CHOIX_DEF[j]||"maison";}
function variante(j,lieu){var s=SEANCES[j];if(!s)return null;return s.v[lieu||lieuDe(j)];}
function debutSemaine(){var n=new Date(),d=(n.getDay()+6)%7,l=new Date(n);
  l.setDate(n.getDate()-d);l.setHours(0,0,0,0);return l.getTime();}
function semaineCourante(){if(!S.debutCycle)return 1;
  return Math.min(7,Math.floor((Date.now()-S.debutCycle)/604800000)+1);}

/* ═══════════ SÉRIE (STREAK) ═══════════ */
function calcStreak(){
  if(!S.logs.length)return{n:0,fait:false,repos:estRepos(new Date().getDay())};
  var faits={};
  S.logs.forEach(function(l){faits[new Date(l.date).toDateString()]=1;});
  var premier=new Date(S.logs[0].date);premier.setHours(0,0,0,0);
  var ok=function(d){return estRepos(d.getDay())||!!faits[d.toDateString()];};
  var auj=new Date();auj.setHours(12,0,0,0);
  var n=ok(auj)?1:0;
  var d=new Date(auj);d.setDate(d.getDate()-1);
  var garde=0;
  while(garde++<600&&d.getTime()>=premier.getTime()&&ok(d)){n++;d.setDate(d.getDate()-1);}
  return{n:n,fait:!!faits[auj.toDateString()],repos:estRepos(auj.getDay())};
}
function majStreakMax(){
  var k=calcStreak().n;
  if(k>S.streakMax){S.streakMax=k;return true;}
  return false;
}

/* ═══════════ FILE D'ATTENTE ET PROGRESSION ═══════════ */
/* Un bloc = un exercice seul, ou un superset entier (les supersets se déplacent
   d'un seul tenant, sinon l'enchaînement n'aurait plus de sens). */
function blocs(v){
  var out=[],vus={};
  v.ex.forEach(function(e,i){
    if(vus[i])return;
    if(!e.grp){out.push({k:"e"+i,idx:[i],nom:e.nom});vus[i]=1;return;}
    var idx=[];v.ex.forEach(function(x,j){if(x.grp===e.grp)idx.push(j);});
    idx.forEach(function(j){vus[j]=1;});
    out.push({k:"g"+e.grp,idx:idx,nom:"Superset "+e.grp+" · "+idx.map(function(j){return v.ex[j].nom;}).join(" + ")});
  });
  return out;
}
function blocsOrdonnes(v){
  var b=blocs(v);
  var ret=(S.active&&S.active.retires)||[];
  if(ret.length)b=b.filter(function(x){return ret.indexOf(x.k)<0||blocEntame(x);});
  var ord=(S.active&&S.active.ordre)?S.active.ordre:null;
  if(!ord||!ord.length)return b;
  var map={};b.forEach(function(x){map[x.k]=x;});
  var out=[];
  ord.forEach(function(k){if(map[k]){out.push(map[k]);delete map[k];}});
  b.forEach(function(x){if(map[x.k])out.push(x);});
  return out;
}
function blocEntame(bl){
  if(!S.active)return false;
  return S.active.series.some(function(s){return bl.idx.indexOf(s.slot)>=0;});
}
function buildQueue(v){
  var q=[];
  blocsOrdonnes(v).forEach(function(bl){
    if(bl.idx.length===1){
      var i=bl.idx[0];
      for(var s=1;s<=nbSeries(v,i);s++)q.push({i:i,set:s});
      return;
    }
    var maxS=0;bl.idx.forEach(function(j){if(nbSeries(v,j)>maxS)maxS=nbSeries(v,j);});
    for(var s2=1;s2<=maxS;s2++)bl.idx.forEach(function(j){if(s2<=nbSeries(v,j))q.push({i:j,set:s2});});
  });
  return q;
}
function nbSeries(v,i){
  var e=v.ex[i],base=e.series;
  if(semaineCourante()===7)base=Math.ceil(base/2);          /* deload réellement appliqué */
  var x=(S.active&&S.active.extra)?(S.active.extra[i]||0):0;
  var m=(S.active&&S.active.moins)?(S.active.moins[i]||0):0; /* séance raccourcie */
  var n=base+x-m;
  var faits=S.active?S.active.series.filter(function(s){return s.slot===i;}).length:0;
  return Math.max(1,Math.max(faits,n));                      /* jamais sous ce qui est déjà fait */
}
function resolu(v,i){
  var o=v.ex[i];
  var sub=(S.active&&S.active.sub)?S.active.sub[o.id]:null;
  if(!sub)return o;
  var n=getEx(sub);
  return{id:n.id,nom:n.nom,series:o.series,min:o.min,max:o.max,repos:o.repos,grp:o.grp,
         type:n.type||o.type,uni:o.uni,pas:n.pas||o.pas,barre:!!n.barre,
         mus:(n.mus&&n.mus.length)?n.mus:o.mus,remplace:o.nom};
}
function curPos(q){return Math.min(S.active.series.length,q.length-1);}
function vActive(){
  if(!S.active)return null;
  var base=SEANCES[S.active.jourNum].v[S.active.lieu];
  if(!S.active.ajouts||!S.active.ajouts.length)return base;
  return{nom:base.nom,duree:base.duree,conseil:base.conseil,ex:base.ex.concat(S.active.ajouts)};
}

function dernieres(exId){
  for(var k=S.logs.length-1;k>=0;k--){
    var s=S.logs[k].series.filter(function(x){return x.exId===exId;});
    if(s.length)return s;
  }
  return null;
}
function recordVol(exId){
  var m=0;
  S.logs.forEach(function(l){l.series.forEach(function(s){
    if(s.exId===exId){var v=(s.charge||1)*s.reps;if(v>m)m=v;}});});
  return m;
}
function objectif(ex,deload){
  var prev=dernieres(ex.id);
  if(!prev)return{charge:0,reps:ex.min,texte:"Première fois — trouve ta charge"};
  var best=prev.reduce(function(a,b){return (b.charge||1)*b.reps>(a.charge||1)*a.reps?b:a;});
  if(deload)return{charge:best.charge,reps:ex.min,texte:"Deload — reste léger"};
  if(ex.type!=="poids"){
    var r=Math.min(best.reps+(ex.type==="temps"?5:1),ex.max+30);
    return{charge:0,reps:r,texte:"Vise "+r+(ex.type==="temps"?" s":"")};
  }
  if(enReprise()){
    var cr=Math.max(0,Math.round(best.charge*0.9/ex.pas)*ex.pas);
    return{charge:cr,reps:ex.min,texte:"Reprise — "+fmt(cr)+" kg × "+ex.min};
  }
  var toutMax=prev.length>=ex.series&&prev.every(function(s){return s.reps>=ex.max;});
  if(toutMax){var c=best.charge+ex.pas;return{charge:c,reps:ex.min,texte:"Monte à "+fmt(c)+" kg × "+ex.min};}
  var f=null;prev.forEach(function(s){if(!f&&s.reps<ex.max)f=s;});f=f||best;
  return{charge:best.charge,reps:f.reps+1,texte:"Vise "+fmt(best.charge)+" kg × "+(f.reps+1)};
}

/* ═══════════ DURÉE ET SÉANCE RACCOURCIE ═══════════ */
function dureeEstimee(v){
  var q=buildQueue(v),t=0;
  q.forEach(function(it){
    var e=v.ex[it.i];
    t+=(e.repos||0)+(e.type==="temps"?(e.min+15):45);
  });
  return Math.round(t/60)+5;   /* +5 min d'échauffement */
}
/* Coupe la séance pour tenir dans le temps disponible : d'abord les séries des
   accessoires, puis les accessoires eux-mêmes, et seulement en dernier les gros
   mouvements. On ne retire jamais un exercice déjà commencé. */
function planReduit(v,cible){
  S.active.moins={};S.active.retires=[];
  if(!cible)return;
  var garde=0;
  while(dureeEstimee(v)>cible&&garde++<80){
    var b=blocsOrdonnes(v),fait=false,k,z,i;
    /* 1. on rabote les séries des accessoires jusqu'à 2 */
    for(k=b.length-1;k>=2&&!fait;k--){
      for(z=0;z<b[k].idx.length;z++){
        i=b[k].idx[z];
        if(nbSeries(v,i)>2){S.active.moins[i]=(S.active.moins[i]||0)+1;fait=true;break;}
      }
    }
    if(fait)continue;
    /* 2. on retire le dernier accessoire, jamais en dessous de 3 blocs */
    var b2=blocsOrdonnes(v),dernier=null;
    for(k=b2.length-1;k>=0;k--){if(!blocEntame(b2[k])){dernier=b2[k];break;}}
    if(b2.length>3&&dernier){S.active.retires.push(dernier.k);continue;}
    /* 3. en dernier recours, les gros mouvements descendent à 2 séries */
    var red=false;
    b2.forEach(function(bl){bl.idx.forEach(function(j){
      if(!red&&nbSeries(v,j)>2){S.active.moins[j]=(S.active.moins[j]||0)+1;red=true;}});});
    if(!red)break;   /* plancher atteint : impossible de descendre plus bas */
  }
}
/* Durée réellement atteignable pour une cible, sans toucher à la séance en cours. */
function dureeApres(v,cible){
  var faux=!S.active;
  var sauvM=null,sauvR=null;
  if(faux)S.active={series:[],extra:{},moins:{},retires:[],lieu:"maison"};
  else{sauvM=S.active.moins;sauvR=S.active.retires;}
  planReduit(v,cible);
  var d=dureeEstimee(v);
  if(faux)S.active=null;
  else{S.active.moins=sauvM||{};S.active.retires=sauvR||[];}
  return d;
}

/* ═══════════ DÉSÉQUILIBRE GAUCHE / DROITE ═══════════
   Sur un unilatéral, un écart durable de plus de 10 % mérite d'être corrigé :
   on commence alors par le côté faible et on aligne le fort sur lui. */
function desequilibre(exId){
  var g=[],d=[];
  S.logs.forEach(function(l){l.series.forEach(function(s){
    if(s.exId!==exId||!s.cote)return;
    var v=(s.charge||1)*s.reps;
    (s.cote==="G"?g:d).push(v);});});
  if(S.active)S.active.series.forEach(function(s){
    if(s.exId!==exId||!s.cote)return;
    var v=(s.charge||1)*s.reps;
    (s.cote==="G"?g:d).push(v);});
  if(g.length<2||d.length<2)return null;
  var mg=g.slice(-4).reduce(function(a,b){return a+b;},0)/Math.min(4,g.length);
  var md=d.slice(-4).reduce(function(a,b){return a+b;},0)/Math.min(4,d.length);
  var fort=Math.max(mg,md),faible=Math.min(mg,md);
  if(!fort)return null;
  var ecart=Math.round((fort/faible-1)*100);
  if(ecart<8)return null;
  return{ecart:ecart,faible:(mg<md?"gauche":"droite"),g:Math.round(mg),d:Math.round(md)};
}
function listeDesequilibres(){
  var out=[],vus={};
  ORDRE.forEach(function(j){
    var sc=SEANCES[j];if(!sc)return;
    ["salle","maison"].forEach(function(l){
      sc.v[l].ex.forEach(function(e){
        if(!e.uni||vus[e.id])return;vus[e.id]=1;
        var ds=desequilibre(e.id);
        if(ds)out.push({ex:e,ds:ds});});});});
  return out;
}

/* ═══════════ STAGNATION ═══════════ */
/* Un exercice stagne si son meilleur volume n'a pas progressé sur 4 séances. */
function stagnation(ex){
  var hist=[];
  S.logs.forEach(function(l){
    var ss=l.series.filter(function(x){return x.exId===ex.id;});
    if(!ss.length)return;
    var best=ss.reduce(function(a,b){return (b.charge||1)*b.reps>(a.charge||1)*a.reps?b:a;});
    hist.push({v:(best.charge||1)*best.reps,charge:best.charge});
  });
  if(hist.length<4)return null;
  var q=hist.slice(-4);
  var maxRecent=Math.max.apply(null,q.map(function(x){return x.v;}));
  if(q[q.length-1].v>q[0].v||maxRecent>q[0].v)return null;
  var cause,quoi;
  if(ex.type!=="poids"){
    cause="Tu plafonnes au poids du corps.";
    quoi="Ajoute du lest, ralentis la descente à 4 s, ou passe à une variante plus dure.";
  }else if(S.active&&S.active.lieu==="maison"&&q[q.length-1].charge>=40){
    cause="Tu approches la limite de ton kit 50 kg.";
    quoi="Passe à une version unilatérale : une seule jambe ou un seul bras porte la charge.";
  }else{
    cause="4 séances sans progression.";
    quoi="Baisse la charge de 10 % pendant deux séances, puis remonte. Repartir plus bas casse le plateau.";
  }
  return{cause:cause,quoi:quoi};
}
function listeStagnation(){
  var out=[],vus={};
  ORDRE.forEach(function(j){
    var sc=SEANCES[j];if(!sc)return;
    ["salle","maison"].forEach(function(l){
      sc.v[l].ex.forEach(function(e){
        if(vus[e.id])return;vus[e.id]=1;
        var st=stagnation(e);
        if(st)out.push({ex:e,st:st});
      });
    });
  });
  return out;
}

/* ═══════════ DISQUES ═══════════ */
function disques(cible,lieu){
  var m=S.matos[lieu==="maison"?"maison":"salle"];
  if(!m)return null;
  var cote=(cible-m.barre)/2;
  if(cote<=0)return{barre:m.barre,liste:[],reste:0,vide:true};
  var reste=Math.round(cote*100)/100,out=[];
  m.disques.slice().sort(function(a,b){return b-a;}).forEach(function(d){
    while(reste>=d-0.001&&out.length<12){out.push(d);reste=Math.round((reste-d)*100)/100;}
  });
  return{barre:m.barre,liste:out,reste:reste,vide:false};
}
function texteDisques(cible,lieu){

  var t=r.liste.map(fmt).join(" + ")+" par côté";
  if(r.reste>0.01)t+="  ·  il manque "+fmt(r.reste*2)+" kg";
  return t;
}

function hex2hsl(h){
  h=h.replace("#","");
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,s=0,t=0;
  if(mx!==mn){
    var d=mx-mn;
    s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)t=((g-b)/d+(g<b?6:0));else if(mx===g)t=((b-r)/d+2);else t=((r-g)/d+4);
    t*=60;
  }
  return[t,s*100,l*100];
}
function hsl(a,b,c){return "hsl("+Math.round(a)+","+Math.round(Math.max(0,Math.min(100,b)))+"%,"+Math.round(Math.max(0,Math.min(100,c)))+"%)";}

  e.style.setProperty("--ombre-prim","hsla("+Math.round(H)+","+Math.round(Sa)+"%,45%,.3)");

var PALIERS=[
 {n:0,t:.55,e:0,nom:"Braise"},{n:3,t:.66,e:1,nom:"Étincelle"},{n:7,t:.77,e:2,nom:"Flamme"},
 {n:14,t:.88,e:3,nom:"Feu"},{n:30,t:.99,e:4,nom:"Brasier"},{n:60,t:1.10,e:5,nom:"Fournaise"},
 {n:120,t:1.20,e:6,nom:"Incendie"},{n:250,t:1.30,e:7,nom:"Volcan"},{n:500,t:1.40,e:8,nom:"Soleil"}];
function palier(n){
  var p=PALIERS[0];
  PALIERS.forEach(function(x){if(n>=x.n)p=x;});
  var i=PALIERS.indexOf(p);
  return{p:p,i:i,suiv:PALIERS[i+1]||null};
}
function flammeSVG(n){
  var pa=palier(n||0),ec="";
  for(var k=0;k<pa.p.e;k++){
    var cx=9+((k*37)%32),cy=30-((k*13)%20),r=(k%3)?1.2:1.8;
    ec+='<circle class="sp" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+
        (k%2?"#FFC94D":"#FF8A3D")+'" style="animation-delay:'+(k*0.4).toFixed(2)+'s"/>';
  }
  return '<svg class="fl" viewBox="0 0 48 62" aria-hidden="true" style="--t:'+pa.p.t+'">'+
    '<defs>'+
    '<radialGradient id="fgA" cx="50%" cy="74%" r="62%">'+
      '<stop offset="0%" stop-color="#FFE8A3"/><stop offset="42%" stop-color="#FFB020"/>'+
      '<stop offset="100%" stop-color="#F0533F"/></radialGradient>'+
    '<radialGradient id="fgB" cx="50%" cy="80%" r="58%">'+
      '<stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#FFE07A"/>'+
      '<stop offset="100%" stop-color="#FFB020" stop-opacity="0"/></radialGradient>'+
    '</defs>'+
    '<g class="fl-o"><path d="M25.5 1c-1 7.5-4.5 11-8.5 15.5C12.5 21.5 8 27 8 36.5 8 49 15.5 59 24 59s16-10 16-22.5c0-7-3-11.5-6.5-15.5-1.5 3.5-3.5 5-5.5 5.5 2-6.5 1.5-14-2.5-21.5z" fill="url(#fgA)"/></g>'+
    '<g class="fl-i"><path d="M25 24c-.5 4.5-2.5 6.5-4.5 9C18.5 35.5 17 38.5 17 43c0 6.5 3.5 11 7 11s7-4.5 7-11c0-4-1.5-6.5-3.5-9.5-1-1.5-2-3-2.5-5 -.8 1.6-1.6 2.5-2.6 3 1.2-2.8 1.4-5 1.6-7.5z" fill="url(#fgB)"/></g>'+
    ec+'</svg>';
}
function carteStreak(){
  var st=calcStreak();
  var etat = st.repos ? "Jour de repos — ta série continue"
           : st.fait ? "Séance faite aujourd'hui"
           : "Séance à faire aujourd'hui";
  var cls = st.repos?"repos":(st.fait?"fait":"todo");
  var pa=palier(st.n);
  return '<button class="streak '+cls+'" data-act="streak"><div class="flamme n'+pa.i+'">'+flammeSVG(st.n)+'</div>'+
    '<div class="sk-txt"><div class="sk-n"><b>'+st.n+'</b> jour'+(st.n>1?'s':'')+' d\'affilée</div>'+
    '<div class="sk-e"><b class="pal">'+pa.p.nom+'</b> · '+etat+'</div></div>'+
    '<div class="sk-max">record<b>'+Math.max(S.streakMax,st.n)+'</b></div></button>';
}

function toggleLieu(j,taille){
  var l=lieuDe(j);
  return '<div class="tg '+(taille||"")+'">'+
    '<button class="'+(l==="salle"?"on":"")+'" data-act="lieu" data-j="'+j+'" data-l="salle">Salle</button>'+
    '<button class="'+(l==="maison"?"on":"")+'" data-act="lieu" data-j="'+j+'" data-l="maison">Maison</button></div>';
}

function blocMuscles(prevu){
  var acc=prevu?volumePrevu():seriesParMuscle();
  var total=0;MUSCLES.forEach(function(m){total+=acc[m];});
  if(!prevu&&total===0)return "";
  var h='<div class="sec">'+(prevu?"Volume prévu par muscle · semaine type":"Séries par muscle · cette semaine")+'</div><div class="card mus">';
  MUSCLES.forEach(function(m,k){
    var v=acc[m],pc=Math.min(100,v/24*100);
    var cl=v>=10&&v<=20?"ok":(v>20?"hi":"lo");
    h+='<div class="mrow"><span class="mnom">'+MNOM[m]+'</span>'+
       '<span class="mtrack"><i class="'+cl+'" style="width:'+pc.toFixed(1)+'%;animation-delay:'+(k*40)+'ms"></i>'+
       '<u style="left:41.7%"></u><u style="left:83.3%"></u></span>'+
       '<b class="mval '+cl+'">'+fmt(v)+'</b></div>';
  });
  h+='<div class="mleg">Zone efficace pour l\'hypertrophie : 10 à 20 séries par muscle et par semaine. '+
     'Une série compte 1 pour le muscle principal, 0,5 pour le secondaire.</div></div>';
  return h;
}

  var h='<div class="wrap">'+carteStreak();
  if(semaineCourante()===6)
    h+='<div class="alerte info"><span class="al-ic">📅</span><span class="al-tx">'+
       '<b>Deload la semaine prochaine</b><i>Dernière semaine à pleine charge : pousse sans te retenir</i></span></div>';
  var dsq=listeDesequilibres();
  if(dsq.length)h+='<button class="alerte" data-act="desq"><span class="al-ic">⚖</span>'+

    '<i>Touche pour voir quoi faire</i></span><span class="chev">›</span></button>';
  var dph=S.photos.length?Math.floor((Date.now()-S.photos[S.photos.length-1])/864e5):null;
  if(S.logs.length>=6&&(dph===null||dph>=14))
    h+='<button class="alerte photo" data-act="nav" data-v="prog"><span class="al-ic">📷</span>'+
       '<span class="al-tx"><b>Photos de progression</b><i>'+(dph===null?"Jamais prises":"Dernières il y a "+dph+" jours")+'</i></span>'+
       '<span class="chev">›</span></button>';

  if(v){
    h+='<div class="hero"><div class="hero-in"><div class="hero-top"><h2>'+esc(v.nom)+'</h2>'+toggleLieu(j)+'</div>'+
       '<div class="meta">'+(lieuDe(j)==="salle"?"Fitness Park":"Maison")+' · '+dureeEstimee(v)+' min · '+v.ex.length+' exercices'+
       (S.cibleTemps?' · <b>raccourcie à '+S.cibleTemps+' min</b>':'')+'</div>'+
       '<button class="chrono-btn" data-act="temps">⏱ '+(S.cibleTemps?S.cibleTemps+' min':'Je n\'ai pas le temps')+'</button>';
    if(S.active)h+='<button class="go haut" data-act="reprendre">Reprendre — '+S.active.series.length+' série'+
       (S.active.series.length>1?'s':'')+' faite'+(S.active.series.length>1?'s':'')+'</button>';
    else if(faits[SEANCES[j].id])h+='<button class="go haut alt" data-act="start">Refaire cette séance</button>';
    else h+='<button class="go haut" data-act="start">Démarrer la séance</button>';
    h+='<div class="tip">'+esc(v.conseil)+'</div></div></div>';
  }else{
    h+='<div class="hero rest"><div class="hero-in"><h2>Repos</h2><div class="meta">'+JOURS[j]+'</div>'+
       '<div class="tip">Le muscle ne se construit pas à l\'entraînement, il se construit aujourd\'hui. Ta série continue quand même.</div></div></div>';
  }

  h+='<div class="sec">Ta semaine</div><div class="week">';
  ORDRE.forEach(function(k,idx){
    var s=SEANCES[k],vv=variante(k);
    var dot=!s?"off":(faits[s.id]?"ok":"");
    h+='<button class="wr'+(k===j?" auj":"")+'" data-act="jour" data-j="'+k+'" style="animation-delay:'+(idx*35)+'ms">'+

function vJour(){
  var j=jourVu,s=SEANCES[j];
  var h='<div class="wrap"><button class="back" data-act="nav" data-v="accueil">‹ Accueil</button>';
  if(!s){
    h+='<div class="hero rest"><div class="hero-in"><h2>'+JOURS[j]+'</h2><div class="meta">Repos complet</div>'+
       '<div class="tip">Aucune séance ce jour-là. Ta série de jours consécutifs continue automatiquement.</div></div></div>';
    return h+'</div>';
  }
  var v=variante(j),deload=semaineCourante()===7;
  h+='<div class="hero"><div class="hero-in"><div class="hero-top"><h2>'+JOURS[j]+'</h2></div>'+
     '<div class="meta">'+esc(v.nom)+' · '+v.duree+' min · '+v.ex.length+' exercices</div></div></div>';
  h+='<div class="sec">Où t\'entraînes-tu ce jour-là ?</div>'+toggleLieu(j,"large");
  h+='<div class="card" style="margin-top:12px"><div class="mut" style="line-height:1.5">'+esc(v.conseil)+'</div></div>';
  h+='<div class="sec">Les exercices</div>';
  v.ex.forEach(function(e,i){
    var cible=e.type==="temps"?(e.min+" s"):(e.min===e.max?e.min:e.min+"-"+e.max);
    var pref="";
    if(e.grp){var g=v.ex.filter(function(x){return x.grp===e.grp;});pref=e.grp+(g.indexOf(e)+1)+". ";}

    h+='<div class="ex" style="animation-delay:'+(i*35)+'ms"><div class="exh"><div class="exn">'+pref+esc(e.nom)+
       '<button class="info" data-act="info" data-id="'+e.id+'" aria-label="Comment faire">i</button></div>'+
       '<div class="exs">'+e.series+' × '+cible+(e.uni?" / jambe":"")+' · repos '+(e.repos===0?"enchaîné":e.repos+" s")+'</div>'+
       '<div class="exo">'+esc(o.texte)+'</div></div><div style="height:14px"></div></div>';

    h+='<button class="btn prim" data-act="start" style="margin-top:10px">'+
       (auj?'Démarrer cette séance':'Faire cette séance aujourd\'hui')+'</button>';
  }

function vSeance(){
  var v=vActive(),q=buildQueue(v),deload=semaineCourante()===7;
  var pos=curPos(q),cur=q[pos],fini=S.active.series.length>=q.length;
  var pc=Math.round(S.active.series.length/q.length*100);
  var h='<div class="wrap"><div class="hero" style="margin-bottom:14px"><div class="hero-in" style="padding-bottom:16px">'+
    '<div class="hero-top"><h2 style="font-size:21px">'+esc(v.nom)+'</h2>'+
    '<div class="htools"><button class="quit" data-act="temps">⏱</button>'+
    '<button class="quit" data-act="bonde">👥</button>'+
    '<button class="quit" data-act="ordre">⇅</button>'+
    '<button class="quit" data-act="quitter">‹ Accueil</button></div></div>'+
    '<div class="meta">'+S.active.series.length+' séries sur '+q.length+' · '+(S.active.lieu==="salle"?"Fitness Park":"Maison")+
    (S.active.jourNum!==new Date().getDay()?' · séance de '+JOURS[S.active.jourNum].toLowerCase():'')+'</div>'+
    '<div class="pbar"><i style="width:'+pc+'%"></i></div>'+
    (S.cibleTemps?'<div class="tipm">Séance raccourcie à '+S.cibleTemps+' min</div>':'')+
    (semaineCourante()===7?'<div class="tipm">Deload : séries divisées par deux</div>':'')+
    '</div></div>';

  var seq=[];blocsOrdonnes(v).forEach(function(bl){bl.idx.forEach(function(j){seq.push(j);});});
  seq.forEach(function(i){
    var orig=v.ex[i],e=resolu(v,i),tot=nbSeries(v,i);
    var faites=[];S.active.series.forEach(function(x,k){
      var m=(x.slot!==undefined)?(x.slot===i):(x.exId===e.id);
      if(m)faites.push({s:x,k:k});});
    var actif=(!fini&&i===cur.i);
    var cls="ex"+(e.grp?" grp":"")+(actif?" now":"")+(faites.length>=tot?" fini":"");
    var pref="";
    if(e.grp){var g=v.ex.filter(function(x){return x.grp===e.grp;});pref=e.grp+(g.indexOf(orig)+1)+". ";}
    var cible=e.type==="temps"?(e.min+" s"):(e.min===e.max?e.min:e.min+"-"+e.max);
    h+='<div class="'+cls+'" id="ex-'+e.id+'"><div class="exh"><div class="exn">'+pref+esc(e.nom)+
       '<button class="info" data-act="info" data-id="'+e.id+'" aria-label="Comment faire">i</button>'+
       (e.remplace?'<span class="swap">remplace '+esc(e.remplace)+'</span>':'')+'</div>'+
       '<div class="exs">'+tot+' × '+cible+(e.uni?" / jambe":"")+' · repos '+(e.repos===0?"enchaîné":e.repos+" s")+'</div>';
    if(actif){
      h+='<div class="exo">'+esc(objectif(e,deload).texte)+'</div>';
      var stx=stagnation(e);
      if(stx)h+='<div class="stagb">Stagne · '+esc(stx.quoi)+'</div>';
    }
    h+='</div><div class="sets">';
    for(var k=0;k<tot;k++){
      var f=faites[k],enc=(actif&&k+1===cur.set);
      if(f){var fe=getEx(f.s.exId);
        h+='<button class="st done'+(f.s.pr?" pr":"")+'" data-act="editset" data-k="'+f.k+'">'+
        (f.s.cote?'<u class="cot">'+f.s.cote+'</u>':'')+
        (fe.type==="poids"?fmt(f.s.charge)+"×"+f.s.reps:f.s.reps)+(f.s.pr?'<em>PR</em>':'')+'</button>';}
      else h+='<span class="st '+(enc?"cur":"")+'">'+(k+1)+'</span>';
    }
    h+='</div>';
    if(actif)h+='<div class="acts"><button class="abtn" data-act="sub" data-i="'+i+'">⇄ Remplacer</button>'+
      '<button class="abtn" data-act="addset" data-i="'+i+'">+ 1 série</button>'+
      '<button class="abtn" data-act="sens" data-id="'+e.id+'">✎ Ressenti</button></div>';
    h+='</div>';
  });
  h+='<button class="btn gh" style="margin-top:12px" data-act="plus">+ Exercices complémentaires</button>';
  h+='<button class="btn gh" data-act="finir">'+
     (fini?"Enregistrer la séance":"Terminer maintenant")+'</button></div>';
  return h;
}

function exosDuLog(l){var ids=[],v={};l.series.forEach(function(s){if(!v[s.exId]){v[s.exId]=1;ids.push(s.exId);}});return ids;}

function vHisto(){
  if(!S.logs.length)return '<div class="wrap"><div class="emp">Aucune séance enregistrée.<br>Démarre celle du jour depuis l\'accueil.</div></div>';
  var ordre=[],map={};
  S.logs.slice().reverse().forEach(function(l){
    var k="Cycle "+l.cycle+" · Semaine "+l.semaine;
    if(!map[k]){map[k]=[];ordre.push(k);}
    map[k].push(l);
  });
  var h='<div class="wrap">';
  ordre.forEach(function(k){
    h+='<div class="h2" style="font-size:15px">'+k+'</div>';
    map[k].forEach(function(l,idx){
      h+='<div class="card tap" data-act="toggle" data-id="'+l.id+'" style="animation-delay:'+(idx*35)+'ms">'+
         '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'+
         '<b style="font-size:14.5px">'+esc(l.nom||l.seanceId)+'</b>'+
         '<span class="mut">'+new Date(l.date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+'</span></div>'+
         '<div class="mut" style="margin-top:4px">'+(l.lieu==="salle"?"Salle":"Maison")+' · '+l.series.length+' séries · volume '+
         Math.round(volume(l)).toLocaleString("fr-FR")+' kg'+(l.ressenti?' · ressenti '+l.ressenti+'/5':'')+'</div>';
      if(ouvertLog===l.id){
        h+='<div class="det">';
        exosDuLog(l).forEach(function(id){
          var e=getEx(id),ss=l.series.filter(function(x){return x.exId===id;});
          h+='<div class="lr"><span>'+esc(e.nom)+'</span><span class="mut">'+
             ss.map(function(x){return (e.type==="poids"?fmt(x.charge)+"×"+x.reps:String(x.reps))+(x.pr?" ★":"");}).join("  ·  ")+
             '</span></div>';
        });
        if(l.notes)h+='<div class="mut" style="margin-top:8px;font-style:italic">'+esc(l.notes)+'</div>';
        h+='</div>';
      }
      h+='</div>';
    });
  });
  return h+'</div>';
}

function tousLesExos(){
  var t=[],vus={};
  ORDRE.forEach(function(j){
    var sc=SEANCES[j];if(!sc)return;
    ["salle","maison"].forEach(function(l){
      sc.v[l].ex.forEach(function(e){if(!vus[e.id]){vus[e.id]=1;t.push(e);}});});
  });
  S.logs.forEach(function(l){l.series.forEach(function(x){
    if(!vus[x.exId]){vus[x.exId]=1;t.push(getEx(x.exId));}});});
  return t;
}
function pointsExo(id){
  var ex=getEx(id),out=[];
  S.logs.forEach(function(l){
    var ss=l.series.filter(function(x){return x.exId===id;});
    if(!ss.length)return;
    var best=ss.reduce(function(a,b){return (b.charge||1)*b.reps>(a.charge||1)*a.reps?b:a;});
    out.push({t:new Date(l.date).getTime(),
              date:new Date(l.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),
              val:ex.type==="poids"?best.charge:best.reps});
  });
  return out;
}
/* Volume total par semaine : la vue d'ensemble de la charge de travail. */
function volumeHebdo(){
  var sem={};
  S.logs.forEach(function(l){
    var d=new Date(l.date),dec=(d.getDay()+6)%7,lu=new Date(d);
    lu.setDate(d.getDate()-dec);lu.setHours(0,0,0,0);
    var k=lu.getTime();
    sem[k]=(sem[k]||0)+volume(l);
  });
  return Object.keys(sem).sort().map(function(k){
    return{t:+k,date:new Date(+k).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),
           val:Math.round(sem[k])};});
}
function vProg(){
  var tous=tousLesExos();
  if(!exSel||!exSel.length){
    var avec=[];
    tous.forEach(function(e){if(avec.length<2&&pointsExo(e.id).length>=2)avec.push(e.id);});
    exSel=avec.length?avec:[tous[0].id];
  }
  var h='<div class="wrap">';

  var vh=volumeHebdo();
  h+='<div class="h2">Performance générale</div><div class="card">';
  if(vh.length>=2){
    var tot=vh[vh.length-1].val,prem=vh[0].val;
    var dv=Math.round((tot/Math.max(1,prem)-1)*100);
    h+='<div class="gh">Volume hebdomadaire · '+tot.toLocaleString("fr-FR")+' kg cette semaine · '+
       (dv>=0?"+":"")+dv+' % depuis le début</div>'+chartMulti([{nom:"Volume total",pts:vh}],"kg");
  }else h+='<div class="emp">Deux semaines d\'entraînement sont nécessaires<br>pour tracer cette courbe.</div>';
  h+='</div>';

  h+=blocMuscles(false)+blocMuscles(true);

  h+='<div class="h2">Comparer des exercices</div>'+
     '<div class="mut" style="margin-bottom:10px">Touche pour ajouter ou retirer, jusqu\'à 5 courbes.</div>'+
     '<div class="chips">';
  tous.forEach(function(e){
    var n=pointsExo(e.id).length;
    if(!n)return;
    var on=exSel.indexOf(e.id)>=0;
    var c=on?COUL[exSel.indexOf(e.id)%COUL.length]:null;
    h+='<button class="chip'+(on?" on":"")+'" data-act="selex" data-id="'+e.id+'"'+
       (c?' style="background:'+c+';border-color:'+c+'"':'')+'>'+esc(e.nom)+'</button>';
  });
  h+='</div>';
  var series=exSel.map(function(id){return{nom:getEx(id).nom,pts:pointsExo(id)};})
                  .filter(function(s){return s.pts.length;});
  h+='<div class="card">'+(series.length?chartMulti(series,"kg"):
     '<div class="emp">Choisis au moins un exercice.</div>')+'</div>';

/* ═══════════ TESTS DE FORCE ═══════════
   Test AMRAP : charge fixe, maximum de répétitions propres. Plus sûr et plus
   reproductible qu'un vrai 1RM, pour un intérêt équivalent en suivi. */
var TESTS_EX=["dc-m","tir-neutre","presse","dmil-d","curl-b","squat-b","tractions","rowing-b"];
function e1rm(charge,reps){            /* estimation d'Epley */
  if(!charge)return 0;
  return Math.round(charge*(1+reps/30)*10)/10;
}
function dernierTest(exId){
  var d=null;
  (S.tests||[]).forEach(function(t){if(t.exId===exId)d=t;});
  return d;
}
function testDu(){                     /* jours depuis le dernier test, tous exercices */
  if(!S.tests||!S.tests.length)return null;
  return Math.floor((Date.now()-S.tests[S.tests.length-1].date)/864e5);
}
function vTests(){
  var j=testDu();
  var h='<div class="wrap"><div class="h2">Tests de force</div><div class="card">'+
    '<p class="mut" style="line-height:1.55">Toutes les <b>8 semaines</b>, prends une charge que tu tiens '+
    'environ 8 fois et fais le maximum de répétitions propres, en t\'arrêtant dès que la technique se dégrade. '+
    'L\'app en déduit une estimation de ton maximum.</p>'+
    '<div class="mut" style="margin-top:10px;line-height:1.5"><b>Pourquoi pas un vrai 1RM :</b> chercher '+
    'son maximum sur une répétition coûte plusieurs jours de fatigue, concentre le risque de blessure sur '+
    'la seule série où la technique casse, et n\'apporte rien de plus pour l\'hypertrophie.</div>';
  if(j!==null)h+='<div class="lr" style="margin-top:10px"><span>Dernier test</span><b>il y a '+j+' j</b></div>';
  if(j===null||j>=56)h+='<div class="note" style="margin-top:10px">C\'est le moment de refaire un test.</div>';
  h+='</div>';

  h+='<div class="h2">Mes références</div>';
  TESTS_EX.forEach(function(id){
    var e=getEx(id),d=dernierTest(id);
    var tous=(S.tests||[]).filter(function(t){return t.exId===id;});
    var prog=null;
    if(tous.length>=2)prog=Math.round((tous[tous.length-1].e1rm/tous[0].e1rm-1)*100);
    h+='<div class="card tst"><div class="tstl"><b>'+esc(e.nom)+'</b>'+
       (d?'<span class="tstv">'+fmt(d.e1rm)+' kg<i>max estimé</i></span>':'<span class="tstv vide">—</span>')+'</div>';
    if(d)h+='<div class="mut" style="margin-top:4px">'+fmt(d.charge)+' kg × '+d.reps+' reps · '+
      new Date(d.date).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"2-digit"})+
      (prog!==null?' · <b class="'+(prog>=0?"gain":"perte")+'">'+(prog>=0?"+":"")+prog+' %</b> depuis le premier test':'')+'</div>';
    h+='<button class="btn prim" data-act="testgo" data-id="'+id+'">'+(d?"Refaire le test":"Faire le test")+'</button></div>';
  });
  var pts=(S.tests||[]).filter(function(t){return t.exId===TESTS_EX[0];})
    .map(function(t){return{date:new Date(t.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),val:t.e1rm};});
  if(pts.length>=2)h+='<div class="h2">'+esc(getEx(TESTS_EX[0]).nom)+'</div><div class="card">'+chart(pts,"kg")+'</div>';
  return h+'</div>';
}

/* Séance interrompue : on demande explicitement quoi faire des exercices non faits,
   pour ne jamais compter dans le volume un exercice qui n'a pas été réalisé. */

  var v=vActive(),out=[];
  blocsOrdonnes(v).forEach(function(bl){
    var reste=0;
    bl.idx.forEach(function(i){
      var f=S.active.series.filter(function(x){return x.slot===i;}).length;
      reste+=Math.max(0,nbSeries(v,i)-f);

    if(reste>0)out.push({bl:bl,reste:reste,entame:blocEntame(bl)});
  });
  return out;
}

/* Redessine uniquement la liste, avec une transition FLIP : les lignes glissent
   au lieu de disparaître et réapparaître. */
function majOrdre(){
  var zone=document.getElementById("ordz");
  if(!zone)return;
  var pos={};
  zone.querySelectorAll("[data-bk]").forEach(function(el){
    pos[el.getAttribute("data-bk")]=el.getBoundingClientRect().top;});
  zone.innerHTML=listeOrdre();
  zone.querySelectorAll("[data-bk]").forEach(function(el){
    var av=pos[el.getAttribute("data-bk")];
    if(av===undefined)return;
    var d=av-el.getBoundingClientRect().top;
    if(!d)return;
    el.style.transition="none";
    el.style.transform="translateY("+d+"px)";
    requestAnimationFrame(function(){
      el.style.transition="transform .32s cubic-bezier(.22,1,.36,1)";
      el.style.transform="";
    });
  });
}

/* ═══════════ MODE SALLE BONDÉE ═══════════
   On coche les blocs indisponibles : ils descendent en fin de séance dans leur
   ordre d'origine, les disponibles remontent. Rien n'est supprimé, tout est
   simplement repoussé, parce qu'une machine se libère en général en cours de séance. */
function reorganiserSelonDispo(bloques){
  var v=vActive(),b=blocsOrdonnes(v);
  var faits=b.filter(blocEntame),libres=b.filter(function(x){return !blocEntame(x);});
  var dispo=[],pris=[];
  libres.forEach(function(x){(bloques.indexOf(x.k)>=0?pris:dispo).push(x);});
  S.active.ordre=faits.concat(dispo,pris).map(function(x){return x.k;});
  S.active.bloques=bloques;
  sauver();
}

/* ═══════════ GLISSER-DÉPOSER ═══════════
   Appui long sur la poignée puis déplacement : la ligne suit le doigt et les
   autres s'écartent. Repose sur les Pointer Events, donc souris et tactile. */
var drag=null;
function ordreLibres(){
  var v=vActive(),b=blocsOrdonnes(v);
  return{faits:b.filter(blocEntame),libres:b.filter(function(x){return !blocEntame(x);})};
}
function dragDebut(e,el){
  var zone=document.getElementById("ordz");if(!zone)return;
  var lignes=[].slice.call(zone.querySelectorAll(".ordi:not(.lock)"));
  var idx=lignes.indexOf(el);if(idx<0)return;
  drag={el:el,zone:zone,lignes:lignes,idx:idx,depart:idx,
        y0:e.clientY,h:el.getBoundingClientRect().height+8};
  el.classList.add("drag");
  el.setPointerCapture&&el.setPointerCapture(e.pointerId);
  vibre(18);
}
function dragBouge(e){
  if(!drag)return;
  var dy=e.clientY-drag.y0;
  drag.el.style.transform="translateY("+dy+"px) scale(1.03)";
  var n=Math.max(0,Math.min(drag.lignes.length-1,drag.depart+Math.round(dy/drag.h)));
  if(n!==drag.idx){
    drag.idx=n;
    drag.lignes.forEach(function(l,i){
      if(l===drag.el)return;
      var d=0;
      if(drag.depart<n&&i>drag.depart&&i<=n)d=-drag.h;
      if(drag.depart>n&&i>=n&&i<drag.depart)d=drag.h;
      l.style.transition="transform .22s cubic-bezier(.22,1,.36,1)";
      l.style.transform=d?"translateY("+d+"px)":"";
    });
    vibre(8);
  }
}
function dragFin(){
  if(!drag)return;
  var d=drag;drag=null;
  d.lignes.forEach(function(l){l.style.transition="";l.style.transform="";});
  d.el.classList.remove("drag");
  if(d.idx!==d.depart){
    var o=ordreLibres(),lib=o.libres;
    var bl=lib.splice(d.depart,1)[0];
    lib.splice(d.idx,0,bl);
    S.active.ordre=o.faits.concat(lib).map(function(x){return x.k;});
    sauver();vibre(20);
  }
  majOrdre();
}
document.addEventListener("pointerdown",function(e){
  var p=e.target.closest&&e.target.closest('[data-act="poig"]');
  if(!p)return;
  e.preventDefault();
  dragDebut(e,p.closest(".ordi"));
},{passive:false});
document.addEventListener("pointermove",function(e){if(drag){e.preventDefault();dragBouge(e);}},{passive:false});
document.addEventListener("pointerup",dragFin);
document.addEventListener("pointercancel",dragFin);
